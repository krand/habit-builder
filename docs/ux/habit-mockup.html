<script>
(() => {
  const root=document.getElementById('habit-mockup');
  const TODAY='2026-10-06', CURRENT_WEEK='2026-10-05';
  const typeNames={checkbox:'Yes / no',counter:'Counter',single:'Single choice',multiple:'Multiple choice'};
  const colors={none:'None',mint:'Mint',amber:'Amber',rose:'Rose',blue:'Blue'};
  const clone=v=>JSON.parse(JSON.stringify(v));
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateOf=s=>new Date(s+'T12:00:00Z');
  const iso=d=>d.toISOString().slice(0,10);
  const shift=(s,n)=>{const d=dateOf(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);};
  const dateLabel=s=>dateOf(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
  const monthLabel=s=>dateOf(s).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
  const nextMonth=(s,n)=>{const d=dateOf(s);d.setUTCMonth(d.getUTCMonth()+n,1);return iso(d);};
  const empty=h=>h.type==='checkbox'?false:h.type==='counter'?0:h.type==='multiple'?[]:null;
  const shortMark=(h,v)=>h.type==='checkbox'?(v?'✓':'·'):h.type==='counter'?(v||'·'):h.type==='single'?(v||'·'):(v.map(c=>c[0]).join('+')||'·');
  const key=(i,d)=>i+'@'+d;
  const defaultHabits=[
    {name:'Sport',type:'checkbox',goal:'Any activity counts',choices:[],demoIndex:0},
    {name:'Video / book',type:'counter',goal:'Count completed sessions',choices:[],threshold:1,demoIndex:1},
    {name:'English / writing',type:'multiple',goal:'Choose everything you did',choices:['English','Writing'],demoIndex:2},
    {name:'S/F marker',type:'single',goal:'Choose one mark',choices:['S','F'],demoIndex:3}
  ];
  const validThreshold=n=>Number.isInteger(n)&&n>=1&&n<=99;
  const validHabit=h=>h&&typeof h.name==='string'&&h.name.length<=50&&Object.hasOwn(typeNames,h.type)&&Array.isArray(h.choices)&&h.choices.length<=8&&h.choices.every(c=>typeof c==='string'&&c.length<=30)&&(h.type!=='counter'||h.threshold===undefined||validThreshold(h.threshold));
  const normalizeHabits=list=>clone(list).map(h=>{const demoIndex=h.demoIndex??defaultHabits.findIndex(d=>d.name===h.name);return {...h,...(demoIndex>=0?{demoIndex}:{}),...(h.type==='counter'?{threshold:h.threshold??1}:{})};});
  const prior=window.openai?.widgetState?.privateContent;
  let habits=prior?.version===2&&Array.isArray(prior.habits)&&prior.habits.length<=8&&prior.habits.every(validHabit)?normalizeHabits(prior.habits):clone(defaultHabits);
  let edits={};
  function validEntry(i,e){const h=habits[i];return h&&e&&Object.hasOwn(colors,e.color)&&typeof e.comment==='string'&&e.comment.length<=200&&(h.type==='checkbox'?typeof e.value==='boolean':h.type==='counter'?Number.isInteger(e.value)&&e.value>=0&&e.value<=99:h.type==='single'?e.value===null||h.choices.includes(e.value):Array.isArray(e.value)&&e.value.every(c=>h.choices.includes(c)));}
  if(prior?.version===2&&prior.edits)Object.entries(prior.edits).forEach(([k,e])=>{if(/^\d+@2026-\d{2}-\d{2}$/.test(k)&&validEntry(Number(k.split('@')[0]),e))edits[k]=clone(e);});
  // Illustrative data only; a changed day becomes a shared override.
  function seed(i,d){
    const h=habits[i],demo=h.demoIndex,n=Number(d.slice(-2));
    let value=empty(h),color='none',comment='';
    if(demo!==undefined&&d>='2026-09-01'&&d<=TODAY){
      if(h.type==='checkbox')value=n%3===0||d==='2026-10-05';
      else if(h.type==='counter')value=n%4===0?2:n%3===0?0:1;
      else if(h.type==='multiple')value=n%5===0?['English','Writing']:n%2===0?['English']:['Writing'];
      else value=n%3===0?'S':'F';
      if(demo===0&&value)color='mint';
      if(demo===0&&d==='2026-10-06'){value=false;color='amber';comment='Rest day. Moving this session to tomorrow.';}
      if(demo===0&&d==='2026-10-05')comment='30-minute walk after work.';
      if(demo===0&&d==='2026-09-24'){color='blue';comment='Tried a new route.';}
      if(demo===1&&d===TODAY)comment='Read a chapter on the commute.';
      if(demo===2&&d===TODAY)value=[];
      if(demo===3&&d===TODAY)value=null;
    }
    return {value,color,comment};
  }
  const entry=(i,d)=>clone(edits[key(i,d)]||seed(i,d));
  const write=(i,d,patch)=>{if(d>TODAY&&Object.hasOwn(patch,'value'))return;edits[key(i,d)]={...entry(i,d),...patch};};
  function statistics(i,start,end){
    const h=habits[i],values=[];
    for(let date=start;date<=end&&date<=TODAY;date=shift(date,1))values.push(entry(i,date).value);
    if(h.type==='checkbox')return [{label:'Yes',count:values.filter(v=>v===true).length}];
    if(h.type==='counter')return [{label:'Threshold met',count:values.filter(v=>v>=h.threshold).length}];
    return h.choices.map(c=>({label:c,count:values.filter(v=>h.type==='single'?v===c:v.includes(c)).length}));
  }
  const phones=[];
  function persist(){
    const state={version:2,statisticsVersion:1,mockup:'charcoal',habits,edits,phones:phones.map(p=>({view:p.view,week:p.week,month:p.month,history:p.history,active:p.active,selection:[...p.selection],density:p.design.density}))};
    if(new TextEncoder().encode(JSON.stringify(state)).length<15300)window.openai?.setWidgetState({modelContent:{habitUx:'Month and calendar-year statistics: Yes days, counter days meeting threshold, counts per choice',selectedTheme:'Charcoal',counterThresholds:habits.filter(h=>h.type==='counter').map(h=>({habit:h.name,threshold:h.threshold})),views:state.phones.map(p=>({view:p.view}))},privateContent:state})?.catch(()=>{});
  }
  function refresh(){phones.forEach(p=>p.render());if(globalThis.lucide)lucide.createIcons();}
  function constrainWeekSelection(p){
    if(p.view!=='week')return;
    const selected=[...p.selection].filter(k=>{const [i,date]=k.split('@');return habits[Number(i)]&&date>=p.week&&date<=shift(p.week,6);});
    const habit=p.active&&selected.includes(key(p.active.i,p.active.date))?String(p.active.i):selected.at(-1)?.split('@')[0];
    p.selection=new Set(selected.filter(k=>k.split('@')[0]===habit));
    if(!p.selection.size)p.active=null;
    else if(!p.active||!p.selection.has(key(p.active.i,p.active.date))){const [i,date]=[...p.selection].at(-1).split('@');p.active={i:Number(i),date};}
  }
  root.querySelectorAll('.hb-phone').forEach((el,index)=>{
    const saved=prior?.version===2&&prior.statisticsVersion===1?prior.phones?.[index]:null;

      if(b.hasAttribute('data-week')){p.week=shift(p.week,Number(b.dataset.week)*7);p.active={i:0,date:p.week===CURRENT_WEEK?TODAY:p.week};p.selection=new Set([key(p.active.i,p.active.date)]);redraw();persist();return;}
      if(b.hasAttribute('data-month')){p.month=nextMonth(p.month,Number(b.dataset.month));p.active={i:p.history,date:p.month==='2026-10-01'?TODAY:p.month};p.selection=new Set([key(p.active.i,p.active.date)]);redraw();persist();return;}
      if(b.hasAttribute('data-cell')){const k=key(i,d);if(p.view==='week'&&[...p.selection].some(selected=>Number(selected.split('@')[0])!==i))p.selection.clear();if(p.selection.has(k)){p.selection.delete(k);if(p.selection.size){const [lastI,lastDate]=[...p.selection].at(-1).split('@');p.active={i:Number(lastI),date:lastDate};}else p.active=null;}else{p.selection.add(k);p.active={i,date:d};}redraw('[data-cell][data-habit="'+i+'"][data-date="'+d+'"]');persist();return;}
      if(b.hasAttribute('data-undo')){p.undo?.forEach(v=>write(v.i,v.date,{color:v.color}));p.undo=null;redraw();persist();return;}
      if(b.hasAttribute('data-create')){
        const name=el.querySelector('[name="habit-name"]').value.trim(),type=el.querySelector('[name="habit-type"]').value;
        const choices=[...new Set(el.querySelector('[name="habit-choices"]').value.split(',').map(v=>v.trim()).filter(Boolean))];
        const threshold=Number(el.querySelector('[name="habit-threshold"]').value);
        if(!name||(['single','multiple'].includes(type)&&(choices.length<2||choices.length>8||choices.some(c=>c.length>30)))){el.querySelector('[data-error]').textContent=!name?'Give the habit a name.':'Add 2–8 choices, each up to 30 characters.';return;}
        if(type==='counter'&&!validThreshold(threshold)){el.querySelector('[data-error]').textContent='Enter a whole number from 1 to 99.';return;}
        habits.push({name,type,goal:type==='counter'?'Count occurrences':type==='checkbox'?'Mark when it happens':type==='single'?'Choose one mark':'Choose everything that applies',choices:['single','multiple'].includes(type)?choices:[],...(type==='counter'?{threshold}: {})});close();return;
      }
      if(!habits[i]||!d)return;
      const h=habits[i],v=entry(i,d).value;
      if(b.hasAttribute('data-toggle'))write(i,d,{value:!v});
      else if(b.hasAttribute('data-count'))write(i,d,{value:Math.min(99,Math.max(0,v+Number(b.dataset.count)))});
      else if(b.hasAttribute('data-choice')){const c=h.choices[Number(b.dataset.choice)];write(i,d,{value:h.type==='single'?(v===c?null:c):(v.includes(c)?v.filter(v=>v!==c):[...v,c])});}
      else return;
      redraw(focusSelector());persist();
    });
    el.addEventListener('keydown',e=>{
      if(p.overlay.hidden)return;
      if(e.key==='Escape'){e.preventDefault();close();}
      if(e.key==='Tab'){const controls=[...p.overlay.querySelectorAll('button:not(:disabled),input,select,textarea')].filter(c=>!c.closest('[hidden]'));const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    });
    p.render=render;render();
    if(globalThis.Tweak){const t=new Tweak({container:el,onChange:()=>{render();persist();}});t.addSelect(p.design,'density',{label:'List spacing',options:['comfortable','compact']});}
  });
  window.addEventListener('openai:set_globals',event=>{
    const state=event.detail?.globals?.widgetState?.privateContent;if(state?.version!==2)return;
    if(Array.isArray(state.habits)&&state.habits.length<=8&&state.habits.every(validHabit))habits=normalizeHabits(state.habits);
    if(state.edits){edits={};Object.entries(state.edits).forEach(([k,e])=>{if(/^\d+@2026-\d{2}-\d{2}$/.test(k)&&validEntry(Number(k.split('@')[0]),e))edits[k]=clone(e);});}
    phones.forEach((p,index)=>{const s=state.phones?.[index];if(!s)return;if(['today','week','habits','history'].includes(s.view))p.view=s.view;if(s.week)p.week=s.week;if(s.month)p.month=s.month;if(Object.hasOwn(s,'active'))p.active=s.active;if(Array.isArray(s.selection))p.selection=new Set(s.selection.filter(k=>typeof k==='string'&&/^\d+@2026-\d{2}-\d{2}$/.test(k)&&habits[Number(k.split('@')[0])]));if(Number.isInteger(s.history)&&s.history<habits.length)p.history=s.history;p.design.density=s.density==='compact'?'compact':'comfortable';});refresh();
  });
  refresh();
})();

</script>
